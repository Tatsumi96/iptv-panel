upstream iptv_api {
    zone iptv_api 64k;
    server api:3000 resolve;
    keepalive 64;
}

upstream iptv_web {
    zone iptv_web 64k;
    server web:3001 resolve;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP (LAN par defaut)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;
    limit_conn perip_conn 64;

    # --- Streaming : pas de buffering, timeouts longs --------------------
    location ~ ^/(live|hls|proxy-stream)/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://iptv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        gzip off;
    }

    # --- API Xtream compatible (player_api.php, get.php, xmltv.php) -------
    location ~ ^/(player_api\.php|get\.php|xmltv\.php)$ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://iptv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- Health check de l'API -------------------------------------------
    location = /health {
        proxy_pass http://iptv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # --- API d'administration --------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://iptv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2m;
    }

    # --- Login admin : zone stricte ---------------------------------------
    location = /api/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_conn perip_conn 8;

        proxy_pass http://iptv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Panel Next.js ----------------------------------------------------
    location / {
        proxy_pass http://iptv_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

