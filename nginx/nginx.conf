user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Resolution DNS dynamique (Docker embedded DNS) ------------------
    # Indispensable : quand un conteneur est recree, son IP change et un
    # `upstream` statique garde l'ancienne IP => 502 jusqu'au reload de nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Performance -----------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens       off;
    types_hash_max_size 4096;

    # --- Compression (uniquement pour l'API/HTML, pas pour le streaming) ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied      any;

    # --- Rate limiting global (anti-DDoS) --------------------------------
    # Zone par IP, 10 req/s avec burst de 40 (zone API)
    limit_req_zone  $binary_remote_addr zone=api_zone:16m rate=10r/s;
    # Zone plus stricte pour l'authentification (1 req/s, burst 5)
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=1r/s;
    # Connexions simultanees par IP (streaming = 1 connexion longue)
    limit_conn_zone $binary_remote_addr zone=perip_conn:16m;

    # --- Buffers ---------------------------------------------------------
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # --- Security headers ------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    include /etc/nginx/conf.d/*.conf;
}
